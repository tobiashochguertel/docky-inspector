<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Docky Inspector</title>
<style>
:root { color-scheme: dark; }
body { background: #111827; color: #e5e7eb; font: 12px system-ui, sans-serif; margin: 16px; }
#bar { position: relative; background: #1f2937; border-radius: 12px; margin: 16px 0; }
.tile { position: absolute; bottom: 0; border: 1px solid #4b5563; border-radius: 6px; box-sizing: border-box; cursor: pointer; }
.tile .icon { display: flex; align-items: center; justify-content: center; color: #fff; opacity: .9; border-radius: 4px; overflow: hidden; }
.tile .kind { font-size: 9px; opacity: .8; }
.tile .idx { position: absolute; top: 1px; left: 2px; font: 9px ui-monospace, monospace; color: #fff; background: #000000aa; border-radius: 3px; padding: 0 3px; pointer-events: none; z-index: 2; }
.xray { position: absolute; pointer-events: none; box-sizing: border-box; z-index: 3; }
.xray.x-icon { border: 1px dashed #22c55e; }
.xray.x-label { border: 1px dashed #facc15; }
.xray.x-paint { border: 1px solid #fb9231; }
.xtag { position: absolute; font: 8px ui-monospace, monospace; color: #fff; background: #000000bb; border-radius: 3px; padding: 0 3px; white-space: nowrap; }
.tile .tlabel { color: #fff; text-align: center; white-space: nowrap; overflow: hidden; line-height: 1.1; opacity: .9; }
.tile.changed { outline: 2px solid #fb9231; }
.tile.added { outline: 2px solid #22c55e; }
.gline { position: absolute; left: -8px; right: -8px; height: 0; border-top: 1px dashed #facc15; pointer-events: none; }
.padbox { position: absolute; border: 1px dashed #f472b6; pointer-events: none; }
.gap { position: absolute; top: -16px; transform: translateX(-50%); font: 9px ui-monospace, monospace; color: #f87171; background: #030712; border-radius: 3px; padding: 0 3px; pointer-events: none; }
#sections { position: absolute; left: 0; right: 0; top: 100%; height: 22px; margin-top: 4px; }
#sections .sec { position: absolute; top: 0; height: 18px; font-size: 10px; color: #9ca3af; border-top: 2px solid #4b5563; white-space: nowrap; overflow: hidden; padding-top: 2px; }
#panel { position: fixed; top: 12px; right: 12px; width: 330px; max-height: 85vh; display: flex; flex-direction: column; background: #030712; border: 1px solid #374151; border-radius: 8px; font: 11px ui-monospace, monospace; }
#panel-head { cursor: grab; user-select: none; padding: 6px 10px; color: #9ca3af; border-bottom: 1px solid #374151; }
#panel-head:active { cursor: grabbing; }
#panel-body { padding: 10px; overflow: auto; white-space: normal; }
#metrics:empty { display: none; }
.bm { text-align: center; font-size: 10px; }
.bm-margin { border: 1px dashed #6b7280; background: #f59e0b33; padding: 20px 26px; position: relative; }
.bm-border { border: 1px solid #9ca3af; padding: 16px 20px; position: relative; }
.bm-padding { border: 1px dashed #6b7280; background: #84cc1633; padding: 22px 26px; position: relative; }
.bm-content { background: #3b82f655; border: 1px solid #3b82f6; min-height: 30px; display: flex; align-items: center; justify-content: center; font-weight: bold; }
.bm-v { position: absolute; left: 50%; transform: translateX(-50%); color: #e5e7eb; }
.bm-h { position: absolute; top: 50%; transform: translateY(-50%); color: #e5e7eb; }
.bm-tag { color: #9ca3af; position: absolute; top: 2px; left: 4px; }
.props details { border-top: 1px solid #1f2937; }
.prev { display: flex; justify-content: center; margin: 8px 0 2px; position: relative; }
.prev img { width: 64px; height: 64px; object-fit: contain; }
.prev .artbox { position: absolute; border: 1px dashed #22c55e; pointer-events: none; }
.props summary { cursor: pointer; padding: 4px 0; color: #e5e7eb; font-weight: bold; }
.props dl { display: grid; grid-template-columns: auto 1fr; gap: 1px 10px; margin: 2px 0 8px; }
.props dt { color: #fca5a5; }
.props dd { margin: 0; overflow-wrap: anywhere; }
.controls label { margin-right: 12px; }
#legend { margin-top: 8px; color: #9ca3af; }
#legend span { margin-right: 14px; }
#legend .sw { display: inline-block; width: 10px; height: 10px; border: 1px dashed; border-radius: 2px; margin-right: 4px; vertical-align: baseline; }
#legend .kindtag { color: #6b7280; }
.sel { outline: 2px solid #fff !important; }
.verdict-ok { color: #22c55e; }
.verdict-bad { color: #f87171; }
.hist { margin-top: 8px; border-top: 1px solid #374151; padding-top: 6px; }
.hist div { cursor: pointer; padding: 1px 0; }
.hist div:hover { color: #fff; }
#viewing { color: #facc15; }
button { background: #1f2937; color: #e5e7eb; border: 1px solid #4b5563; border-radius: 6px; padding: 2px 10px; cursor: pointer; }
</style>
</head>
<body>
<h2>Docky Inspector <span id="live">●</span> <span id="viewing"></span></h2>
<div id="verdicts"></div>
<div class="controls" style="margin-top:8px" id="guides"></div>
<div id="legend"><span><i class="sw" style="border-color:#3b82f6"></i>tile frame</span><span><i class="sw" style="border-color:#22c55e"></i>icon slot</span><span><i class="sw" style="border-color:#fb9231"></i>painted visual</span><span><i class="sw" style="border-color:#facc15"></i>label frame</span><span><i class="sw" style="border-color:#f472b6"></i>padding</span><span class="kindtag">kind tag = placeholder when real icons are off</span></div>
<div id="bar"></div>
<div id="panel"><div id="panel-head">✥ metrics</div><div id="panel-body"><div><button id="live-btn" style="display:none">● back to live</button></div><div id="metrics">click a tile…</div><div class="hist" id="hist"></div></div></div>
<script src="/app.js"></script>
</body>
</html>
